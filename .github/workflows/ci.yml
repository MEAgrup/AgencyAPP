      # `sales_targets` (Sales OKR, kunci alami) + `sales_level_labels`
      # (jabatan→label Level Sales, katalog dual-home), 128 → 130. Nol prefix
      # baru (kunci alami keduanya) ⇒ entity_prefix TETAP 36; nol status ⇒
