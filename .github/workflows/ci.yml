      - name: Verify table count (expect 153)
        run: |
          n=$(psql -h 127.0.0.1 -U postgres -d cdps -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")
          echo "public base tables: $n"
          test "$n" -eq 153
      # M6A §7: the prefix registry is the DB half of a two-mechanism guarantee —
      # 26 as-built prefixes + STRG/PLAN/VND + CTR (O57) + ITV (Interview). The TS
      # half (PREFIXES in packages/core/src/ident.ts) is asserted against this
      # table by packages/db/src/ident.registry.test.ts, which also scans every
      # ID-minting call site. A count gate here catches a migration that lands
      # without its registry row.
      # 33 = 32 + WRR (Modul 6D D-01, 20260813010000: Rekap Hasil Mingguan).
      # 34 = 33 + MLS (T-4c, 20260814070000: Client Milestone).
      # 35 = 34 + TSK (20260814110000: Penugasan Internal).
      # 37 = 36 + RNW (Kinerja Sales R-03, 20260902020000: Renewal Request).
      # 39 = 37 + SCR + ADL (Gelombang 3 SKU Screener SC-01..SC-07,
      #      20260908050000_gelombang3_sku_screener.sql).
