name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cdps_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CDPS_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/cdps_test?parseTime=true&multiStatements=true"
      CDPS_DSN: "root:root@tcp(127.0.0.1:3306)/cdps?parseTime=true&multiStatements=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - name: Create databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS cdps; CREATE DATABASE IF NOT EXISTS cdps_test;"
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        run: go test -p 1 -count=1 ./...
      - name: migrate up/down smoke
        working-directory: backend
        run: |
          go run ./cmd/migrate up
          go run ./cmd/seed
          go run ./cmd/migrate down all

  web-internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web-internal (skips until the frontend exists)
        run: |
          if [ -f web-internal/package.json ]; then
            cd web-internal && npm ci && npm run build
          else
            echo "web-internal/ not present yet — frontend agent owns it. Skipping."
          fi
      # Framework-free unit tests (sidebar permission gates per role). Runs after
      # the build so a broken build is still the first failure reported.
      - name: Test web-internal
        run: |
          if [ -f web-internal/package.json ]; then
            cd web-internal && npm test
          fi

  # @cdps/api — the API route handlers (Fase 1 langkah 4). Typecheck the whole app
  # (route handlers + libs against the @cdps/* source) and run the framework-free
  # lib unit tests (JWT verification, error mapping). No DB / no Next build here —
  # the domain logic the handlers call is gated by db-and-migrations.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace (root)
        # apps/api + packages/* are one npm workspace (repo-root package.json).
        # A single root `npm ci` installs & symlinks every @cdps/* package and
        # hoists their deps (postgres, bcryptjs), so per-package installs are gone.
        run: npm ci
      - name: '@cdps/api — typecheck + lib tests'
        run: |
          npm run typecheck -w @cdps/api
          npm test -w @cdps/api

  # New Supabase/TypeScript stack (Fase 0 migration). Pure engines + wrappers.
  core-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace (root)
        run: npm ci
      - name: '@cdps/core — test + typecheck'
        run: |
          npm run typecheck -w @cdps/core
          npm test -w @cdps/core

  # @cdps/db executor wiring + end-to-end integration against a migrated Postgres.
  # Applies EVERY supabase/migrations file in order to a fresh PG17, then runs the
  # integration suite (sm_transition / ident_next / notify_emit / audit immutability)
  # inside rolled-back transactions. This is the migration's self-apply gate.
  db-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cdps
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/cdps"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace (root)
        run: npm ci
      - name: Apply all migrations in order
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "applying $(basename "$f")"
            psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f "$f"
          done
      # 17 events = the 15 frozen (Phase 0 v2 §9) + the 2 lead-delete additions
      # logged in docs/DECISIONS.md 2026-07-29. Keep in step with the CATALOG in
      # packages/core/src/notification.ts — the notification.test.ts assertions
      # are the other half of this gate.
      - name: Verify migration seed counts (14 machines, 17 events)
        run: |
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin
               if (select count(*) from sm_machines) <> 14 then raise exception 'expected 14 machines'; end if;
               if (select count(*) from notif_events) <> 17 then raise exception 'expected 17 events'; end if;
             end \$\$;"
      - name: Alpha Digital seed fixture — apply twice (idempotency) + verify
        run: |
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin
               if (select count(*) from employees) <> 10 then raise exception 'expected 10 employees'; end if;
               if (select count(*) from role_mappings) <> 12 then raise exception 'expected 12 role_mappings'; end if;
               if (select count(*) from master_services) <> 3 then raise exception 'expected 3 master_services (seed not idempotent?)'; end if;
               if (select count(*) from demo_tasks) <> 1 then raise exception 'expected 1 demo_task (seed not idempotent?)'; end if;
             end \$\$;"
      # 54 = 53 + lead_delete_requests (20260102000012, DECISIONS 2026-07-29).
      - name: Verify table count (expect 54)
        run: |
          n=$(psql -h 127.0.0.1 -U postgres -d cdps -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")
          echo "public base tables: $n"
          test "$n" -eq 54
      - name: Invariant — ID generator (gap-free, WIB period)
        run: psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/tests/ident_checks.sql
      - name: Invariant — append-only history (immutability)
        run: psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/tests/immutability_checks.sql
      - name: Invariant — Row Level Security (permission predicate parity)
        run: psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_checks.sql
      - name: Invariant — Supabase Auth custom claims (ResolveActor parity)
        run: psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/tests/auth_claims_checks.sql
      - name: '@cdps/db — test (incl. integration) + typecheck'
        run: |
          npm run typecheck -w @cdps/db
          npm test -w @cdps/db
      - name: '@cdps/domain — test (incl. integration) + typecheck'
        # Exercises the employee importer, demo-task service, M5 finance, M1 lead
        # read models, etc. end-to-end against the migrated Postgres above.
        run: |
          npm run typecheck -w @cdps/domain
          npm test -w @cdps/domain
