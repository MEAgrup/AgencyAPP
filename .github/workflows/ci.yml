      # ⚠️ GATE KEDUA untuk angka yang sama — `scripts/db-rebuild.sh` punya
      # `check "entity_prefix"` sendiri. Naikkan KEDUANYA dalam satu commit.
      # 41 = 40 + SKU (M18, 20260924010000_m18_store_ops_sku.sql: baris SKU Store
      #      Operation). Sengaja BUKAN memakai ulang SCR-/ADL- (Gelombang 3 SKU
      #      Screener): keduanya run screening Ads atas sebuah ekspor, tanpa
      #      induk Brief dan tanpa lifecycle sendiri.
      # 42 = 41 + SLOT (M19, 20260927010000: slot produksi harian Creative).
      #      Prefix `SCS` (baris SMO & Content Strategist) SENGAJA belum
      #      didaftarkan — bentuknya masih pertanyaan terbuka `M19-SCS-ENGINE`
      #      di DECISIONS.md §Open (M12 §2 Rule 1 membekukan Task = Asset |
      #      Creator Booking | Brief-as-task, sementara barisnya ber-client_id
      #      nullable). Registry yang mendaftarkan entitas yang bentuknya belum
      #      diketok menjanjikan sesuatu yang belum ada.
      - name: Verify entity_prefix registry (expect 42)
        run: |
          n=$(psql -h 127.0.0.1 -U postgres -d cdps -tAc "select count(*) from entity_prefix;")
          echo "entity_prefix rows: $n"
          test "$n" -eq 42
      - name: Invariant — ID generator (gap-free, WIB period)
        run: psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/tests/ident_checks.sql
      - name: Invariant — append-only history (immutability)
        run: psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/tests/immutability_checks.sql
      - name: Invariant — Row Level Security (permission predicate parity)
        run: psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_checks.sql
      - name: Invariant — Supabase Auth custom claims (ResolveActor parity)
        run: psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/tests/auth_claims_checks.sql
      - name: '@cdps/db — test (incl. integration) + typecheck'
        run: |
          npm run typecheck -w @cdps/db
          npm test -w @cdps/db
      - name: '@cdps/domain — test (incl. integration) + typecheck'
        # Exercises the employee importer, demo-task service, M5 finance, M1 lead
        # read models, etc. end-to-end against the migrated Postgres above.
        run: |
          npm run typecheck -w @cdps/domain
          npm test -w @cdps/domain
      - name: '@cdps/api — test (jalur rute yang butuh DB)'
        # The `api` job above runs the SAME suite without a DATABASE_URL, so every
        # DB-backed route test there is silently skipped — including the Gelombang B
        # acceptance chain (`src/e2e/gelombang-b-uat.e2e.test.ts`), which walks
        # Riset Awal → Section B → Section E → Plan → Brief through the real route
        # handlers. Running it here, against the Postgres this job already migrated,
        # is what makes those skips actually execute somewhere.
        run: npm test -w @cdps/api
