name: CI

on:
  push:
  pull_request:

jobs:
  web-internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web-internal (skips until the frontend exists)
        run: |
          if [ -f web-internal/package.json ]; then
            cd web-internal && npm ci && npm run build
          else
            echo "web-internal/ not present yet — frontend agent owns it. Skipping."
          fi
      # Framework-free unit tests (sidebar permission gates per role). Runs after
      # the build so a broken build is still the first failure reported.
      - name: Test web-internal
        run: |
          if [ -f web-internal/package.json ]; then
            cd web-internal && npm test
          fi

  # M15-C2 — Client Portal, a wholly separate Next app (own auth realm, own
  # deploy) from web-internal. Same skip-until-present shape as web-internal's
  # own job above, for the same reason (frontend not always present yet during
  # earlier build order).
  web-client-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web-client-portal (skips until the app exists)
        run: |
          if [ -f web-client-portal/package.json ]; then
            cd web-client-portal && npm ci && npm run build
          else
            echo "web-client-portal/ not present yet — M15-C2 not started. Skipping."
          fi
      - name: Test web-client-portal
        run: |
          if [ -f web-client-portal/package.json ]; then
            cd web-client-portal && npm test
          fi

  # @cdps/api — the API route handlers (Fase 1 langkah 4). Typecheck the whole app
  # (route handlers + libs against the @cdps/* source) and run the framework-free
  # lib unit tests (JWT verification, error mapping). No DB / no Next build here —
  # the domain logic the handlers call is gated by db-and-migrations.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace (root)
        # apps/api + packages/* are one npm workspace (repo-root package.json).
        # A single root `npm ci` installs & symlinks every @cdps/* package and
        # hoists their deps (postgres, bcryptjs), so per-package installs are gone.
        run: npm ci
      - name: '@cdps/api — typecheck + lib tests'
        run: |
          npm run typecheck -w @cdps/api
          npm test -w @cdps/api
      # Lint was never run on this workspace: `eslint.config.mjs` only landed with
      # #79, and before it eslint exited non-zero with "couldn't find a config" —
      # so 210 TS files (every route handler + wire.ts) were unlinted. Warnings
      # are fatal here on purpose: the one pre-existing warning is fixed (T2b),
      # so the gate starts from zero and cannot silently accumulate.
      - name: '@cdps/api — lint'
        run: npm run lint -w @cdps/api -- --max-warnings 0

  # New Supabase/TypeScript stack (Fase 0 migration). Pure engines + wrappers.
  core-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace (root)
        run: npm ci
      - name: '@cdps/core — test + typecheck'
        run: |
          npm run typecheck -w @cdps/core
          npm test -w @cdps/core

  # @cdps/db executor wiring + end-to-end integration against a migrated Postgres.
  # Applies EVERY supabase/migrations file in order to a fresh PG17, then runs the
  # integration suite (sm_transition / ident_next / notify_emit / audit immutability)
  # inside rolled-back transactions. This is the migration's self-apply gate.
  db-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cdps
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/cdps"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace (root)
        run: npm ci
      # Tiru DEFAULT PRIVILEGES Supabase SEBELUM migrasi — berpasangan dengan
      # `scripts/db-rebuild.sh` dan dengan gerbang `rls_checks` §44.
      #
      # Proyek Supabase memasang `ALTER DEFAULT PRIVILEGES IN SCHEMA public
      # GRANT ALL ON TABLES/FUNCTIONS TO anon, authenticated, service_role`.
      # Postgres polos TIDAK. Selisih itu membuat satu kelas cacat STRUKTURAL
      # tak terlihat di sini: sebuah migrasi menulis `REVOKE EXECUTE ... FROM
      # PUBLIC` (yang tidak menyentuh hibah eksplisit per-role), CI hijau, dan
      # di produksi fungsi SECURITY DEFINER-nya bisa dipanggil `anon`.
      #
      # Sudah terjadi TIGA KALI, ketiganya nol test merah dan ketahuan hanya
      # karena seseorang membaca ACL live sesudah apply:
      #   1. wrr_monday_job / wrr_reminder_tick / penugasan_reminder_tick (14 Agu)
      #   2. stage_overdue_tick / permintaan_reminder_tick                (31 Agu)
      #   3. leads_unrespon_tick                                          ( 4 Sep)
      #
      # Role dibuat lebih dulu karena ALTER DEFAULT PRIVILEGES menuntutnya ada;
      # `20260723064438_rls_baseline.sql` membuat role yang sama dengan
      # IF NOT EXISTS, jadi ia melewatinya tanpa keluhan.
      - name: Mirror Supabase default privileges (makes rls_checks §44 meaningful)
        run: |
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
          END $$;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES    TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO anon, authenticated, service_role;
          SQL
      - name: Apply all migrations in order
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "applying $(basename "$f")"
            psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f "$f"
          done
      # 33 events = 17 (v1: the 15 frozen Phase 0 v2 §9 + the 2 lead-delete
      # additions logged 2026-07-29) + 14 (v2: the single M6A/6B/6C amendment +
      # m6.client.assigned, DECISIONS O55/O53 2026-08-07) + 2 (v3: M5-OA-7
      # transaction-change, DECISIONS 2026-08-04) + 1 (v4: M6A §4 D-7 sanggahan
      # target, DECISIONS 2026-08-08 A-08). Keep in step with the
      # CATALOG in packages/core/src/notification.ts — notification.test.ts is
      # the other half of this gate.
      # 20 machines = the 14 ported from Go + `vendor` and `strategi` (mesin #15),
      # keduanya dari migrasi M6A 20260806063000/064000, + `plan` (mesin #16,
      # 20260810000000_m6b_plan.sql, B-01) + `plan_satuan` (mesin #17 dormansi,
      # 20260811000000_m6b_plan_satuan.sql, B-10) + `interview` (mesin #19,
      # 20260811030000_interview.sql, Modul Interview / Kelola Klien tab 1)
      # + `riset_awal` (mesin #20, 20260812100000_interview_riset_awal.sql — langkah 1
      # "Kelola Klien": Berjalan -> Selesai, QA pemilik 2026-08-12).
      #
      # 43 events = 34 (v1..v4) + 9 (v5: Interview / Kelola Klien tab 1,
      # 20260811020000_notif_catalog_v5_interview.sql, DECISIONS 2026-08-11).
      # The literal 43 below is a convenience, NOT the invariant. The invariant is
      # the second check: count(notif_events) must equal SUM(event_count) over
      # notif_catalog_versions. That is what O55 bought — an event added without a
      # registered version fails even if someone also bumps the literal.
      # 44 events = 43 + 1 (v6: kualifikasi_prasyarat_menggantung, eskalasi prasyarat
      # menggantung >= 2 per AM, 20260811080000_interview_prasyarat_eskalasi.sql,
      # DECISIONS 2026-08-11 Interview bagian 2). Sama seperti v5: literal 44 hanya
      # kenyamanan — invariant sebenarnya adalah kesamaan dengan SUM(event_count).
      # 21 = 20 + mesin #18 weekly_result_recap (Modul 6D D-02, 20260813020000:
      #      Terjadwal→Terbuka→Ditutup|Ditutup Otomatis→(Head)Terbuka).
      # 48 = 44 + 4 (v7: M6D Rekap Hasil Mingguan — rekap_mingguan_terbuka,
      #      rekap_mingguan_belum_dikonfirmasi, rekap_sengketa_angka,
      #      catatan_divisi_belum_diisi wajib RM-8; 20260813070000_m6d_notif_v7.sql,
      #      DECISIONS 2026-08-13 RM-6 sign-off). Literal 48 hanya kenyamanan —
      #      invariant sebenarnya adalah kesamaan dengan SUM(event_count).
      # 52 = 48 + 4 (v8: T-2c Hold Service two-step; 20260814080000).
      # 54 = 52 + 2 (v9: Penugasan Internal — penugasan_ditugaskan, penugasan_selesai;
      #      20260814110000_penugasan_internal.sql, DECISIONS 2026-08-14).
      # 23 = 22 + mesin #21 `internal_task` (Penugasan Internal:
      #      [Ditugaskan]→[Dikerjakan]→[Selesai] | →[Dibatalkan]).
      # 58 = 57 + 1 (v11: M8 Ads eskalasi ROAS underperforming —
      #      m8.ads.roas_underperforming; 20260818040000_m8_roas_underperforming_notif.sql.
      #      Nol mesin/tabel/kolom baru ⇒ 23 mesin TETAP).
      # 57 = 54 + 3 (v10: Penugasan Internal jatuh tempo & pembatalan —
      #      penugasan_mendekati_jatuh_tempo, penugasan_jatuh_tempo,
      #      penugasan_dibatalkan; 20260814120000). Nol mesin/tabel baru (dua
      #      KOLOM penanda idempotensi) ⇒ 23 mesin TETAP.
            # M16 fondasi (20260829001000): +1 tabel `division_registry` (122→123),
      # +1 prefix REQ (35→36), +7 event katalog v12 (58→65). Mesin TETAP 23 —
      # mesin tahapan (Akun A) & mesin REQ (Akun B) datang di migrasi mereka
      # sendiri. Katalog dinaikkan SEKALI untuk KEDUA stream paralel: invariant
      # menjumlahkan event_count per versi, jadi dua bump terpisah memecahkannya
      # dua kali (docs/handoff/PARALEL_M16_DUA_AKUN.md F-4).
            # M16 Akun A Fase 2 (20260830020000_m16_stage_seed.sql): +5 mesin
      # tahapan (stage_creative, stage_kol, stage_live, stage_ai_opt_sku,
      # stage_ai_opt_video), 23 → 28. Nol event katalog baru (sudah dibereskan
      # Tahap F v12) ⇒ notif_events TETAP 65.
      # M16 Akun B Fase 4 (20260831040000_req_permintaan.sql): +1 mesin
      # `permintaan` (REQ-, M16 §5.5), 28 → 29. Ditulis di langkah penggabungan
      # §5 PARALEL_M16_DUA_AKUN.md setelah dihitung ulang dari DB gabungan.
      # Kinerja Sales R-03 (20260902020000_renewal_request.sql): +1 mesin
      # `renewal_request` (RNW-, STATE_MACHINES.md §20), 29 → 30. Nol event
      # katalog baru dari migrasi ini sendiri.
      # Kinerja Sales R-04 (20260902030000_renewal_notif.sql, katalog v13): +2
      # event (`m0.renewal.pending_approval`/`m0.renewal.decision`, sama peran
      # persis dengan `m0.negotiation.*`), 65 → 67. Nol mesin baru.
      # Revisi Sales/Creative/Performa L2 (20260911050000_m1_unrespon_notif.sql,
      # katalog v14): +2 event (`m1.attempt.unrespon`/`m1.attempt.auto_not_qualified`,
      # keduanya resolver 'explicit' -> pemilik attempt; emitter job
      # leads_unrespon_tick), 67 → 69. Nol mesin baru (L1 hanya menambah
      # sm_edges pada mesin prospect_attempt yang sudah ada — 31 TETAP).
      # Feedback OD F-3 (20260922100100_f3_notif_feedback_od.sql, katalog v15):
      # +4 event (`m6.brief.siap_review_am`/`m6.brief.selesai`, keduanya resolver
      # 'explicit' -> AM pemilik klien; `m9.booking.jatuh_tempo`/
      # `m9.campaign.mendekati_akhir`, keduanya 'explicitOrLeads' -> koordinator
      # KOL + AM), 69 → 73. SATU bump untuk keempatnya, alasan sama dengan v12:
      # dua jalur paralel mengerjakan emitternya masing-masing, dan dua bump
      # terpisah memecahkan invariant dua kali. Nol tabel/prefix/mesin baru ⇒
      # 146 tabel / 40 prefix / 31 mesin TETAP.
      #
      # M18 Store Operation (20260924010000_m18_store_ops_sku.sql): +1 mesin
      # (31 → 32) `store_ops_sku`, mesin #32 — [Menunggu Eksekusi] → [Dikerjakan]
      # → [Terupload] → [Dievaluasi], plus [Gagal Upload] dua arah dari
      # [Dikerjakan]. [Terupload] = SELESAI produksi dan sengaja BUKAN terminal
      # (ketokan K-6: angka dampak dipisah dari "selesai" supaya leadtime
      # produksi tidak ternoda tunggu pasar ~30 hari). Nol event katalog baru ⇒
      # notif_events TETAP 73: event Store Ops didaftarkan bersama emitternya
      # (preseden v9 `internal_tasks`), dan Brief-nya sudah ikut
      # BriefSiapReviewAm/BriefSelesai (B-1).
      # D-3 tutup buku (20260925020000_d3_tutup_buku.sql, Gelombang D): +1 mesin
      # `book_period` (32 → 33, STATE_MACHINES.md §23) — DUA gerbang yang sengaja
      # berbeda: menutup = Finance lead ATAU Director, membuka kembali = Director
      # SAJA. Nol event katalog baru ⇒ notif_events TETAP 73 (kunci tutup buku
      # bukan sesuatu yang butuh inbox; ia dilihat saat orang membuka layarnya).
      # +2 tabel (`book_periods`, `book_period_snapshots`) — TIDAK digerbang di
      # sini, hanya di scripts/db-rebuild.sh. Nol prefix baru.
      - name: Verify migration seed counts (33 machines, 73 events, catalog registry consistent)
        run: |
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin
               if (select count(*) from sm_machines) <> 33 then raise exception 'expected 33 machines'; end if;
               if (select count(*) from notif_events) <> 73 then raise exception 'expected 73 events'; end if;
               if (select count(*) from notif_events)
                  <> (select coalesce(sum(event_count), 0) from notif_catalog_versions)
                 then raise exception 'notif_events does not match the registered catalog versions'; end if;
               if (select count(*) from notif_events where catalog_version = 1) <> 17
                 then raise exception 'catalog v1 must stay at 17 events'; end if;
             end \$\$;"
      - name: Alpha Digital seed fixture — apply twice (idempotency) + verify
        run: |
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -h 127.0.0.1 -U postgres -d cdps -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin
               if (select count(*) from employees) <> 10 then raise exception 'expected 10 employees'; end if;
               if (select count(*) from role_mappings) <> 12 then raise exception 'expected 12 role_mappings'; end if;
               if (select count(*) from master_services) <> 6 then raise exception 'expected 6 master_services (3 seed + Komisi 20260806050000 + AI Video + Optimasi SKU 20260831070000 M17 LT-53; seed not idempotent?)'; end if;
               if (select count(*) from demo_tasks) <> 1 then raise exception 'expected 1 demo_task (seed not idempotent?)'; end if;
             end \$\$;"
      # KEEP IN STEP WITH `scripts/db-rebuild.sh` — the same gate lives in both
      # files, and last session raised only one of them: the whole test suite was
      # green while CI failed on `expected 14 machines`. Adding a table or a
      # machine means editing BOTH, in the same commit.
      #
      # 104 = 103 + interview_prasyarat_eskalasi (20260811080000_interview_prasyarat_eskalasi.sql,
