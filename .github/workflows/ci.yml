name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cdps_test
          MYSQL_USER: cdps
          MYSQL_PASSWORD: cdps
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Grant test-database privileges
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON \`cdps\\_test%\`.* TO 'cdps'@'%'; GRANT CREATE, DROP ON *.* TO 'cdps'@'%'; FLUSH PRIVILEGES;"
      - name: Vet
        run: cd backend && go vet ./...
      - name: Test
        env:
          CDPS_TEST_MYSQL_DSN: cdps:cdps@tcp(127.0.0.1:3306)/cdps_test?parseTime=true&multiStatements=true
        run: cd backend && go test ./...
